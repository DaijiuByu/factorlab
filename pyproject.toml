[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab"
version = "0.2.0"
description = "A point-in-time-safe toolkit for cross-sectional factor research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FactorLab contributors"}]
keywords = ["quantitative-finance", "factor-investing", "backtesting", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "akshare>=1.18.64",
]

[project.optional-dependencies]
backtest = ["vectorbt>=0.27"]
boosting = ["lightgbm>=4.0", "xgboost>=2.0"]
fast = ["polars>=1.0", "duckdb>=1.0"]
bayesian = ["pymc>=5.0"]
all = [
  "vectorbt>=0.27",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "polars>=1.0",
  "duckdb>=1.0",
  "pymc>=5.0",
]

[project.scripts]
factorlab = "factorlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
